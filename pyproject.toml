[project]
name = "shrooms"
version = "0.0.0"
description = "Video-game-style ecosystem sandbox for learning multi-agent simulation, agent orchestration and world models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full 1-year runs"]
